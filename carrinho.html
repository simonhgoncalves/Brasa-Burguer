<body class="claro">

   <a class="menucontorno" id="btnEntrar" href="login.html">Entrar</a>
   <a class="menucheio" id="btnCadastrar" href="cadastro.html">Cadastrar</a>

 </div>
</header>
 <main>
        <section id="carrinho" class="pagina">
            <h2>Carrinho</h2>
            <div id="carrinho-area">
                <div id="listaCarrinho"></div>
                <aside id="resumo">
                    <h3>Resumo</h3>
                    <p>Subtotal: <b id="subtotal">R$ 0,00</b></p>
                    <p>Entrega: <b id="entrega">R$ 0,00</b></p>
                    <p class="total">Total: <b id="total">R$ 0,00</b></p>
                    <label for="pagamento">Forma de pagamento</label>
                    <select id="pagamento"><option>Pix</option><option>Cartão</option><option>Dinheiro</option></select>
                    <button class="botao" id="finalizar">Finalizar pedido</button>
                </aside>
            </div>
        </section>
 </main>
    <footer class="footer">
